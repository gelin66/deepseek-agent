name: Bug report
description: Report a reproducible DSE defect without sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a DSE defect. Do not include API keys, private
        source, raw provider payloads, or unredacted local paths. Report
        security issues privately through SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: DSE version or revision
      description: Paste `dse --version` output or the exact Git revision.
      placeholder: 0.8.68 (0123456789ab)
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: Entry point
      options:
        - Interactive dse
        - dse exec
        - dse app-server
        - dse-tui
        - Delivery/install lifecycle
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, terminal, Rust version, sandbox, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal numbered steps using a disposable repository when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Stable error codes, sanitized logs, verifier output, or screenshots. Remove secrets and private content.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues and current documentation.
          required: true
        - label: I removed credentials, private source, raw provider traffic, and sensitive paths.
          required: true
        - label: This is not a security vulnerability that needs private reporting.
          required: true
