name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Format, check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --locked

  delivery:
    name: Delivery lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run local delivery lifecycle
        run: ./scripts/test-dse-delivery.sh
      - name: Build checksum-bound package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dse-delivery-target
        run: ./scripts/dse-delivery.sh package --output-dir dist
      - name: Verify packaged install without release discovery
        run: |
          artifact="$(find dist -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          ./scripts/dse-delivery.sh install \
            --artifact "$artifact" \
            --prefix "${{ runner.temp }}/dse-prefix"
          "${{ runner.temp }}/dse-prefix/bin/dse" --version
          "${{ runner.temp }}/dse-prefix/bin/dse-tui" --version
          ./scripts/dse-delivery.sh verify \
            --prefix "${{ runner.temp }}/dse-prefix"
          ./scripts/dse-delivery.sh uninstall \
            --prefix "${{ runner.temp }}/dse-prefix"
      - uses: actions/upload-artifact@v4
        with:
          name: dse-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
