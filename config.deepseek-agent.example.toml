# Focused local configuration for the `deepseek-agent` branch.
# Keep the credential out of this file:
#   export DEEPSEEK_API_KEY='your-key'

provider = "deepseek"
base_url = "https://api.deepseek.com"
default_text_model = "deepseek-v4-pro"
reasoning_effort = "max"

allow_shell = true
approval_policy = "on-request"
sandbox_mode = "workspace-write"
max_subagents = 6

[subagents]
max_concurrent = 6
max_depth = 2

[features]
shell_tool = true
subagents = true
apply_patch = true
exec_policy = true

# Not part of the focused local surface. Enable per task when needed.
web_search = false
mcp = false

[retry]
enabled = true
max_retries = 3
initial_delay = 1.0
max_delay = 60.0
exponential_base = 2.0
