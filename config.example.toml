# DSE DeepSeek-only configuration
#
# Canonical user path: ~/.dse/config.toml
# Save a key with `dse auth set`; avoid committing credentials.
#
# The model backend is fixed to the official DeepSeek API. There is no
# `provider`, `[providers.*]`, fallback-provider, OAuth-provider, custom-header,
# TLS-bypass, model-catalog, or route-mode configuration.

# api_key = "..."
base_url = "https://api.deepseek.com"
default_text_model = "deepseek-v4-pro"

# `off`, `low`, `medium`, `high`, or `max`.
reasoning_effort = "max"

# CLI/runtime presentation and local execution posture.
output_mode = "text"
verbosity = "normal"
log_level = "info"
telemetry = false
approval_policy = "on-request"
sandbox_mode = "workspace-write"
allow_shell = true
yolo = false

# Optional local paths. MCP server definitions live in the JSON file named by
# `mcp_config_path`; MCP OAuth is transport auth, not model-provider auth.
# skills_dir = "~/.dse/skills"
# mcp_config_path = "~/.dse/mcp.json"
# instructions = ["~/.dse/AGENTS.md"]

[retry]
enabled = true
max_retries = 3
initial_delay = 1.0
max_delay = 60.0
exponential_base = 2.0

[features]
subagents = true
exec_policy = true

[tui]
alternate_screen = "auto"
mouse_capture = true
terminal_probe_timeout_ms = 250
stream_chunk_timeout_secs = 900
osc8_links = true

[ui]
# Human-facing CLI/TUI/app-server projection only; never changes model prompts.
language = "en"

[skills]
scan_dse_only = false

[subagents]
enabled = true
max_concurrent = 4
max_depth = 3

# Search has its own retrieval adapter vocabulary. This setting does not
# select or alter the model provider.
[search]
provider = "duckduckgo"

# Named profiles may override non-model TUI/local settings only. They cannot
# contain api_key, base_url, default_text_model, provider, or providers tables.
[profiles.quiet]
verbosity = "concise"
allow_shell = false

# Project-local `.dse/config.toml` is untrusted. It may tighten approval
# and sandbox posture and set safe local tool values, but cannot change
# credentials, endpoint, model, telemetry, or provider identity.
