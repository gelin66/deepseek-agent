[package]
name = "dse-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "App-server transport for DSE runtime integrations"
# `dse app-server` is owned by dse-cli; this crate is library-only.
autobins = false

[dependencies]
axum.workspace = true
dse-app = { path = "../app", version = "0.8.68" }
dse-protocol = { path = "../protocol", version = "0.8.68" }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true

[dev-dependencies]
libc = "0.2"
rusqlite.workspace = true
sha2.workspace = true
tempfile.workspace = true
tower = "0.5"
