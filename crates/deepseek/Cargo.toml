[package]
name = "dse-deepseek"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Official DeepSeek request planning for DSE"

[dependencies]
async-stream = "0.3.6"
async-trait.workspace = true
dse-runtime = { path = "../runtime", version = "0.8.68" }
futures-util = "0.3.31"
httpdate = "1.0.3"
reqwest = { workspace = true, features = ["stream", "http2", "gzip"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
dse-context = { path = "../context", version = "0.8.68" }
rustls.workspace = true
