[package]
name = "codewhale-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool invocation lifecycle, schema validation, and scheduler parallelism for CodeWhale"

[features]
default = []
pdf = ["dep:pdf-extract"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
codewhale-protocol = { path = "../protocol", version = "0.8.68" }
crossterm = "0.29"
ignore = "0.4"
pdf-extract = { version = "0.12", optional = true }
regex = "1.11"
similar = "3"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
shlex = "1.3.0"
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing.workspace = true
uuid.workspace = true
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
portable-pty = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }
