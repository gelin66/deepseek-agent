<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Deployment configuration</title>
  </head>
  <body>
    <main id="release-channel"></main>
    <template data-probe-identity>{{DSE_APPLICATION_PROBE_LEASE}}</template>
    <script>
      const decode = (values) => String.fromCharCode(...values);
      const label = decode([97, 114, 105, 97, 45, 108, 97, 98, 101, 108]);
      const targetValue = decode([99, 97, 110, 97, 114, 121]);
      const target = document.createElement(decode([105, 110, 112, 117, 116]));
      target.type = decode([116, 101, 120, 116]);
      target.setAttribute(
        label,
        decode([82, 101, 108, 101, 97, 115, 101, 32, 99, 104, 97, 110, 110, 101, 108]),
      );
      target.addEventListener(decode([105, 110, 112, 117, 116]), () => {
        document.querySelector("#release-result")?.remove();
        if (target.value !== targetValue) return;
        const status = document.createElement(decode([115, 101, 99, 116, 105, 111, 110]));
        status.id = "release-result";
        status.setAttribute(decode([114, 111, 108, 101]), decode([115, 116, 97, 116, 117, 115]));
        status.setAttribute(
          label,
          decode([82, 101, 108, 101, 97, 115, 101, 32, 99, 104, 97, 110, 110, 101, 108, 32, 115, 101, 116, 32, 116, 111, 32, 99, 97, 110, 97, 114, 121]),
        );
        status.setAttribute(
          decode([100, 97, 116, 97, 45, 99, 104, 97, 110, 110, 101, 108]),
          targetValue,
        );
        status.textContent = status.getAttribute(label);
        document.querySelector("#release-channel").append(status);
      });
      document.querySelector("#release-channel").append(target);
    </script>
  </body>
</html>
