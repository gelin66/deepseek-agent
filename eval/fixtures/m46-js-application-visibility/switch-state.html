<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Retry policy</title>
  </head>
  <body>
    <main id="settings"></main>
    <template data-probe-identity>{{DSE_APPLICATION_PROBE_LEASE}}</template>
    <script>
      const decode = (values) => String.fromCharCode(...values);
      setTimeout(() => {
        const control = document.createElement("button");
        control.type = "button";
        control.setAttribute(decode([114, 111, 108, 101]), decode([115, 119, 105, 116, 99, 104]));
        control.setAttribute(
          decode([97, 114, 105, 97, 45, 108, 97, 98, 101, 108]),
          decode([65, 117, 116, 111, 109, 97, 116, 105, 99, 32, 114, 101, 116, 114, 105, 101, 115, 32, 101, 110, 97, 98, 108, 101, 100]),
        );
        control.setAttribute(decode([97, 114, 105, 97, 45, 99, 104, 101, 99, 107, 101, 100]), decode([116, 114, 117, 101]));
        control.textContent = control.getAttribute(decode([97, 114, 105, 97, 45, 108, 97, 98, 101, 108]));
        document.querySelector("#settings").replaceChildren(control);
      }, 25);
    </script>
  </body>
</html>
